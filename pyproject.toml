[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
# E/F/W: errores y estilo básico; B: bugs probables; S: seguridad (bandit); UP: sintaxis moderna.
select = ["E", "F", "W", "B", "S", "UP"]
ignore = [
    "S603",  # subprocess sin shell y con lista de argumentos: es el uso previsto en estos scripts.
    "S607",  # los comandos (wpctl, nmcli, ...) se resuelven por PATH a propósito.
]

[tool.ruff.lint.per-file-ignores]
# Los menús añaden su carpeta a sys.path antes de importar `common`.
".config/waybar/scripts/glass/*.py" = ["E402"]
"tests/**/*.py" = ["S101", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
