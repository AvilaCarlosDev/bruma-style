name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep shellcheck

      - name: Run repository checks
        run: ./tests/run.sh

      - name: Run ShellCheck
        run: shellcheck install.sh scripts/*.sh tests/*.sh .config/hypr/scripts/*.sh .config/waybar/scripts/*.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest

  gtk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb python3-gi gir1.2-gtk-3.0 gir1.2-gtklayershell-0.1 python3-pytest

      - name: UI tests (real GTK under Xvfb)
        run: xvfb-run -a python3 -m pytest tests/gtk -p no:cacheprovider

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject AI watermarks in files and commit messages
        run: |
          pattern='Generated (by|with) (AI|Claude|ChatGPT|Copilot)|claude\.ai/code|Claude-Session'
          if git grep -nEi "$pattern" -- . ':!README*.md' ':!.github/workflows/ci.yml'; then
            echo "::error::AI watermark found in tracked files"; exit 1
          fi
          if git log --format=%B | grep -Ei "^(Co-Authored-By: *(Claude|ChatGPT|Copilot)|Claude-Session:)"; then
            echo "::error::AI trailer found in commit messages"; exit 1
          fi
